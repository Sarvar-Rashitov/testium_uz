<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)" />
  
  <!-- Check mark for success/accurate evaluation -->
  <g transform="translate(32, 32)">
    <!-- Checkmark path -->
    <polyline points="-12,0 -6,6 12,-8" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Optional: Add a subtle document/exam icon -->
  <rect x="22" y="18" width="20" height="24" rx="2" fill="none" stroke="white" stroke-width="2" opacity="0.3" />
</svg>
